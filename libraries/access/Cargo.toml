[package]
name = "weaveling-access"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }

authorizing = { version = "0.1.0", path = "../authorizing", package = "weaveling-authorizing" }
eventsourcing = { version = "0.1.0", path = "../eventsourcing", package = "weaveling-eventsourcing" }
transacting = { version = "0.1.0", path = "../transacting", package = "weaveling-transacting" }

[features]
postgres = ["dep:sqlx", "transacting/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "transacting/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
test-harness = { version = "0.1.0", path = "../test-harness", package = "weaveling-test-harness" }
