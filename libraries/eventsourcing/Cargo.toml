[package]
name = "weaveling-eventsourcing"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
time = { workspace = true }

serde_json = { workspace = true }
sqlx = { workspace = true, optional = true, features = ["uuid"] }
uuid = { workspace = true, optional = true }

clock = { version = "0.1.0", path = "../clock", package = "weaveling-clock" }
messaging = { version = "0.1.0", path = "../messaging", package = "weaveling-messaging", optional = true }

[features]
postgres = ["dep:sqlx", "dep:uuid", "dep:messaging", "dep:tracing"]

[dev-dependencies]
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

test-harness = { version = "0.1.0", path = "../test-harness", package = "weaveling-test-harness" }
