[package]
name = "weaveling-live"
version.workspace = true
edition.workspace = true

[dependencies]
acting = { version = "0.1.0", path = "../acting", package = "weaveling-acting" }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
axum-test = { workspace = true, features = ["ws"], optional = true }

authorizing = { version = "0.1.0", path = "../authorizing", package = "weaveling-authorizing" }
eventpublishing = { version = "0.1.0", path = "../eventpublishing", package = "weaveling-eventpublishing" }
eventsourcing = { version = "0.1.0", path = "../eventsourcing", package = "weaveling-eventsourcing" }
messaging = { version = "0.1.0", path = "../messaging", package = "weaveling-messaging" }
live-contract = { version = "0.1.0", path = "../live-contract", package = "weaveling-live-contract" }

[features]
testing = ["dep:axum-test", "tokio/time"]

[dev-dependencies]
axum-test = { workspace = true, features = ["ws"] }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
