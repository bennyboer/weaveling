[package]
name = "weaveling-throttling"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }

chores = { version = "0.1.0", path = "../chores", package = "weaveling-chores" }
clock = { version = "0.1.0", path = "../clock", package = "weaveling-clock" }
transacting = { version = "0.1.0", path = "../transacting", package = "weaveling-transacting", optional = true }

[features]
postgres = ["dep:sqlx", "dep:transacting", "transacting/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
test-harness = { version = "0.1.0", path = "../test-harness", package = "weaveling-test-harness" }
