[package]
name = "weaveling-outbox"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }

serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true, features = ["uuid"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
uuid = { workspace = true, optional = true }

clock = { version = "0.1.0", path = "../clock", package = "weaveling-clock" }
messaging = { version = "0.1.0", path = "../messaging", package = "weaveling-messaging" }
transacting = { version = "0.1.0", path = "../transacting", package = "weaveling-transacting" }

[features]
postgres = ["dep:sqlx", "dep:uuid", "messaging/postgres", "transacting/postgres"]
sqlite = ["dep:sqlx", "dep:uuid", "sqlx/sqlite", "transacting/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

test-harness = { version = "0.1.0", path = "../test-harness", package = "weaveling-test-harness" }
