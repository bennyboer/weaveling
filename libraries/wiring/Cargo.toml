[package]
name = "weaveling-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }

authorizing = { version = "0.1.0", path = "../authorizing", package = "weaveling-authorizing" }
chores = { version = "0.1.0", path = "../chores", package = "weaveling-chores" }
clock = { version = "0.1.0", path = "../clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../eventsourcing", package = "weaveling-eventsourcing" }
live = { version = "0.1.0", path = "../live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../outbox", package = "weaveling-outbox" }
transacting = { version = "0.1.0", path = "../transacting", package = "weaveling-transacting" }
messaging = { version = "0.1.0", path = "../messaging", package = "weaveling-messaging" }

[features]
postgres = ["dep:sqlx", "eventsourcing/postgres", "outbox/postgres", "transacting/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "transacting/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }

test-harness = { version = "0.1.0", path = "../test-harness", package = "weaveling-test-harness" }
