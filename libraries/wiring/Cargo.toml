[package]
name = "weaveling-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }

clock = { version = "0.1.0", path = "../clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../eventsourcing", package = "weaveling-eventsourcing" }
outbox = { version = "0.1.0", path = "../outbox", package = "weaveling-outbox" }
messaging = { version = "0.1.0", path = "../messaging", package = "weaveling-messaging" }

[features]
postgres = ["dep:sqlx", "eventsourcing/postgres", "outbox/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "eventsourcing/sqlite", "outbox/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
