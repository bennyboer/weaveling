name: weaveling

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # The tests run many at once, each with a schema and a small pool of its own.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: weaveling
      POSTGRES_PASSWORD: weaveling
      POSTGRES_DB: weaveling
    ports:
      - "5432:5432"
    volumes:
      - written:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - ./features:/repo/features:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaveling -d weaveling"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  written:
