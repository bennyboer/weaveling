# Weaveling's settings, every one of them, as they would be written.
#
# Copy this file to weaveling.toml beside the server, or name it with
# --config <path> or WEAVELING_CONFIG. Every key may be left out, and each
# has a variable of the same meaning that wins over the file.
#
# A value the server cannot read stops it at start, saying which key in which
# file holds it, and so does a key it does not know.

[server]
# Where the server listens, an address and a port. Left out, on this machine
# only, at port 3000; "0.0.0.0:3000" listens on every address it has.
# WEAVELING_LISTEN
# listen = "127.0.0.1:3000"
#
# Where people open the instance in their browser, which is not always where
# it listens: behind a proxy, say. Keys and passkeys are bound to its domain
# name, so without it none can be added, and moved to another domain, every
# key added before stops working. https, or http only at localhost; no path.
# WEAVELING_PUBLIC_URL
# public_url = "https://weaveling.example.com"
#
# The built client the server hands out beside /api, the folder
# `cargo leptos build --release --split` makes. Left out, the server hands out no
# client, unless cargo-leptos started it, which names the folder it built.
# WEAVELING_CLIENT_DIR
# client_dir = "target/site"

[storage]
# Where the work is kept. Leave both out to keep it in memory, which a restart
# empties; set one, never both.
#
# PostgreSQL, one database per feature beside the one named here.
# WEAVELING_DATABASE_URL
# database_url = "postgres://weaveling:weaveling@127.0.0.1:5432/weaveling"
#
# Local mode: one SQLite file per feature in this folder, made if missing.
# WEAVELING_DATA
# data = "/home/author/weaveling"

[accounts]
# Whether people sign in, and each book is seen only by those let into it.
# Off, there is one person, who owns everything: local mode.
# WEAVELING_ACCOUNTS
# enabled = true
#
# Who may make an account: "open" for anyone, "invitation" for those invited
# by the operator or into a project.
# WEAVELING_SIGN_UP
# sign_up = "open"
#
# The key that seals every account's two-step sign-in secret: 64 hexadecimal
# digits, such as `openssl rand -hex 32` prints. Without it, two-step sign-in
# cannot be set up; lost, every account's two-step sign-in is lost with it.
# Given itself as totp_key or WEAVELING_TOTP_KEY, or, better kept out of this
# file, as totp_key_file or WEAVELING_TOTP_KEY_FILE, the path of a file that
# holds it, such as /etc/weaveling/totp.key. Set one of the two, never both.

[mail]
# Where mail goes until there is a mail server to send it: left out, into the
# log; named, each mail as a file in this folder.
# WEAVELING_MAIL_DROP
# drop = "target/mails"

[testing]
# The share of messages every listener refuses on purpose, from 0 to 1, so the
# alarm and its dialog can be tried by hand. Never for an author.
# WEAVELING_FLAKY
# flaky = 0.5
