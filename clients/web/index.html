<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weaveling</title>
    <link data-trunk rel="rust" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --paper: #fdfcfb;
        --alarm: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --paper: #1c1917;
          --alarm: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; }
      h1 {
        font: 400 2.5rem/1.1 Georgia, "Iowan Old Style", serif;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      .tagline {
        font: italic 1.05rem/1.5 Georgia, serif;
        color: var(--muted);
        margin: 0 0 2.5rem;
      }
      .new-project { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      input {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
      }
      input:focus-visible { outline: 2px solid var(--ink); outline-offset: -1px; }
      button {
        padding: 0.6rem 1rem;
        border: 1px solid var(--line);
        border-radius: 0.375rem;
        background: transparent;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      button.danger:hover { border-color: var(--alarm); color: var(--alarm); }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button:disabled:hover { border-color: var(--line); color: var(--ink); }
      .problem {
        border-left: 3px solid var(--alarm);
        padding: 0.5rem 0.75rem;
        color: var(--alarm);
        margin: 0 0 1.5rem;
      }
      .empty { color: var(--muted); font-style: italic; }
      .projects { list-style: none; margin: 0; padding: 0; }
      .projects li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--line);
      }
      .name { flex: 1; font-size: 1.05rem; }
      .stamp { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
      .actions { position: relative; display: flex; gap: 0.375rem; }
      .actions button { padding: 0.35rem 0.6rem; font-size: 0.85rem; }
      .menu-button {
        display: grid;
        place-items: center;
        padding: 0.35rem;
        border-color: transparent;
        color: var(--muted);
      }
      .menu-button:hover { color: var(--ink); border-color: var(--line); }
      .menu {
        position: absolute;
        top: calc(100% + 0.25rem);
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        min-width: 9rem;
        padding: 0.25rem;
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        background: var(--paper);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.18);
      }
      .menu button {
        border: none;
        border-radius: 0.25rem;
        text-align: left;
        padding: 0.45rem 0.6rem;
      }
      .menu button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: rgb(0 0 0 / 0.5);
        z-index: 20;
      }
      .dialog {
        max-width: 26rem;
        padding: 1.5rem;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        background: var(--paper);
        box-shadow: 0 16px 48px rgb(0 0 0 / 0.3);
      }
      .dialog h2 {
        font: 400 1.35rem/1.2 Georgia, serif;
        margin: 0 0 0.5rem;
      }
      .dialog p { margin: 0 0 1.5rem; color: var(--muted); }
      .dialog-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
      .prose { margin-top: 2.5rem; }
      .liveness {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .surface {
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        background: var(--paper);
        min-height: 8rem;
      }
      .surface blockquote {
        margin: 0 0 0 0.5rem;
        padding-left: 1rem;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }
      .ProseMirror {
        position: relative;
        word-wrap: break-word;
        white-space: break-spaces;
        font-variant-ligatures: none;
        outline: none;
      }
      .ProseMirror pre { white-space: pre-wrap; }
      .ProseMirror li { position: relative; }
      .ProseMirror-hideselection *::selection { background: transparent; }
      .ProseMirror-hideselection { caret-color: transparent; }
      .ProseMirror [contenteditable="false"] { user-select: text; }
      img.ProseMirror-separator {
        display: inline !important;
        border: none !important;
        margin: 0 !important;
      }
      .ProseMirror-yjs-cursor {
        position: relative;
        margin-left: -1px;
        margin-right: -1px;
        border-left: 1px solid orange;
        border-right: 1px solid orange;
        word-break: normal;
        pointer-events: none;
      }
      .ProseMirror-yjs-cursor > div {
        position: absolute;
        top: -1.15em;
        left: -1px;
        padding: 0.05rem 0.3rem;
        border-radius: 0.2rem;
        font: 500 0.65rem/1.4 system-ui, sans-serif;
        white-space: nowrap;
        color: #1c1917;
        user-select: none;
      }
    </style>
  </head>
  <body></body>
</html>
