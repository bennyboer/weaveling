[package]
name = "weaveling-client-web"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = { workspace = true }
gloo-net = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
leptos_router = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "History",
    "HtmlElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "Location",
    "Selection",
    "Storage",
    "UrlSearchParams",
    "Window",
] }
time = { workspace = true, features = [
    "parsing",
    "formatting",
    "macros",
    "local-offset",
    "wasm-bindgen",
] }

messaging-contract = { version = "0.1.0", path = "../../libraries/messaging-contract", package = "weaveling-messaging-contract" }
words = { version = "0.1.0", path = "../../libraries/words", package = "weaveling-words" }

appearances-contract = { version = "0.1.0", path = "../../features/appearances/contract", package = "weaveling-appearances-contract" }
boards-contract = { version = "0.1.0", path = "../../features/boards/contract", package = "weaveling-boards-contract" }
outline-contract = { version = "0.1.0", path = "../../features/outline/contract", package = "weaveling-outline-contract" }
ideas-contract = { version = "0.1.0", path = "../../features/ideas/contract", package = "weaveling-ideas-contract" }
scenes-contract = { version = "0.1.0", path = "../../features/scenes/contract", package = "weaveling-scenes-contract" }
projects-contract = { version = "0.1.0", path = "../../features/projects/contract", package = "weaveling-projects-contract" }
statistics-contract = { version = "0.1.0", path = "../../features/statistics/contract", package = "weaveling-statistics-contract" }
