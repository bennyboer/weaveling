      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid #2a3036; border-radius: 12px; background: #16191c; height: 176px;">
        <div style="display: flex; gap: 5px;">

          <span style="width: 38px; height: 22px; border-radius: 3px; background: #23282d;"></span>

        <div style="flex-grow: 1;"></div>

        <div style="font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: 26px; line-height: 1.1; color: #eef1f2;">The Cartographer's Daughter</div>
        <div style="display: flex; gap: 10px; font-size: 12px; color: #6e767c;"><span>112 pieces</span><span>&#183;</span><span>Last week</span></div>
      </div>
    </div>
  </div>
</div>
