<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lexend:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #d99a52; text-decoration: none; }
    a:hover { color: #e8b273; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #0f1113; font-family: Lexend, system-ui, sans-serif; color: #e6e8ea; overflow: hidden;">

  <div style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 0; border-right: 1px solid #22262a; background: #131619; flex-shrink: 0;">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#e6e8ea" stroke-width="1.4" style="margin-bottom: 14px;">
      <circle cx="16" cy="16" r="13" stroke="#d99a52" stroke-dasharray="3 5" opacity="0.75"></circle>
      <path d="M6 11c7 6 13 6 20 0M5 20c8-5 14-5 22 0" opacity="0.35"></path>
      <ellipse cx="16" cy="17" rx="5" ry="6"></ellipse>
      <circle cx="13.6" cy="14" r="1.7" fill="#e6e8ea"></circle>
      <circle cx="18.4" cy="14" r="1.7" fill="#e6e8ea"></circle>
      <path d="M11 15l-4-3M21 15l4-3M11 19l-4 2M21 19l4 2"></path>
    </svg>

    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; background: #23282d;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e6e8ea" stroke-width="1.8"><rect x="3" y="4" width="7" height="6" rx="1"></rect><rect x="13" y="4" width="8" height="10" rx="1"></rect><rect x="3" y="13" width="7" height="7" rx="1"></rect></svg>
    </span>
    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c848b" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
    </span>
    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4e565c" stroke-width="1.8"><path d="M3 12h18M7 8v8M13 6v12M18 9v6"></path></svg>
    </span>
    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4e565c" stroke-width="1.8"><path d="M5 4v10a4 4 0 004 4h10M9 8v6a3 3 0 003 3h8"></path></svg>
    </span>
    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4e565c" stroke-width="1.8"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19a5.5 5.5 0 0111 0M16 6.2a3 3 0 010 5.6M18.5 19a5.5 5.5 0 00-2.2-4.4"></path></svg>
    </span>

    <div style="flex-grow: 1;"></div>
    <span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7c848b" stroke-width="1.8"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg>
    </span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 52px; border-bottom: 1px solid #22262a; background: #131619; flex-shrink: 0;">
      <span style="font-family: 'Instrument Serif', 'Times New Roman', serif; font-size: 22px; letter-spacing: 0.01em;">The Salt Road</span>
      <span style="padding: 3px 9px; border-radius: 4px; background: #1e2226; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #8b9196;">Board</span>
      <div style="flex-grow: 1;"></div>
      <span style="font-size: 12px; color: #7c848b;">31 pieces</span>
      <div style="display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; background: #d99a52; color: #0f1113; font-size: 12px; font-weight: 500;">B</div>
    </div>

    <div style="flex-grow: 1; position: relative; background-color: #0f1113; background-image: radial-gradient(circle at 1px 1px, #262b30 1px, transparent 0); background-size: 24px 24px; overflow: hidden;">

      <div style="position: absolute; left: 80px; top: 88px; width: 220px; height: 100px; padding: 14px 16px; border: 1px solid #2a3036; border-radius: 8px; background: #191d21;">
        <div style="font-size: 15px; line-height: 1.42; color: #dfe3e6;">The loom remembers what the weaver forgets</div>
      </div>

      <div style="position: absolute; left: 356px; top: 232px; width: 220px; height: 84px; padding: 14px 16px; border: 1px solid #2a3036; border-radius: 8px; background: #191d21;">
        <div style="font-size: 15px; line-height: 1.42; color: #dfe3e6;">She never returned from the salt flats</div>
      </div>

      <div style="position: absolute; left: 634px; top: 108px; width: 272px; height: 156px; padding: 14px 16px; border: 1px solid #2a3036; border-radius: 8px; background: #191d21;">
        <div style="font-size: 15px; line-height: 1.42; color: #dfe3e6;">A knock at midnight, and the innkeeper pretends to be asleep</div>
      </div>

      <div style="position: absolute; left: 968px; top: 300px; width: 220px; height: 84px; padding: 14px 16px; border: 1px solid #2a3036; border-radius: 8px; background: #191d21;">
        <div style="font-size: 15px; line-height: 1.42; color: #dfe3e6;">The cartographer's daughter</div>
      </div>

      <div style="position: absolute; left: 340px; top: 404px; display: flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid #2f353b; border-radius: 9px; background: #22272c; box-shadow: 0 10px 28px rgba(0,0,0,0.5);">
        <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dfe3e6" stroke-width="1.8"><path d="M16.5 3.5l4 4L8 20H4v-4z"></path></svg>
        </span>
        <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dfe3e6" stroke-width="1.8"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"></path></svg>
        </span>
        <span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dfe3e6" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </span>
      </div>

      <div style="position: absolute; left: 340px; top: 456px; width: 236px; height: 100px; padding: 13px 15px; border: 1.5px solid #d99a52; border-radius: 8px; background: #191d21; box-shadow: 0 0 0 3px rgba(217,154,82,0.13);">
        <div style="font-size: 15px; line-height: 1.42; color: #f0f3f5;">Salt is a kind of memory<span style="display: inline-block; width: 1.5px; height: 17px; background: #d99a52; vertical-align: -3px; margin-left: 1px;"></span></div>
      </div>

      <div style="position: absolute; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid #2a3036; border-radius: 9px; background: #191d21;">
        <span style="display: grid; place-items: center; width: 28px; height: 28px; font-size: 15px; color: #b6bcc1;">&#8722;</span>
        <span style="min-width: 44px; text-align: center; font-size: 12px; color: #7c848b; font-variant-numeric: tabular-nums;">100%</span>
        <span style="display: grid; place-items: center; width: 28px; height: 28px; font-size: 15px; color: #b6bcc1;">+</span>
      </div>

      <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 10px; border: 1px solid #2a3036; border-radius: 999px; background: #191d21;">
        <span style="font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #6e767c;">Waiting</span>
        <span style="padding: 3px 9px; border-radius: 999px; background: #23282d; font-size: 12.5px; color: #c3c9ce;">The ferryman's price</span>
        <span style="padding: 3px 9px; border-radius: 999px; background: #23282d; font-size: 12.5px; color: #c3c9ce;">Winter, and no letters</span>
        <span style="font-size: 12px; color: #6e767c;">+1</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
