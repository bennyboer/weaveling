<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Lexend:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1d5c6b; text-decoration: none; }
    a:hover { color: #14424e; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #f4f4f2; font-family: Lexend, system-ui, sans-serif; color: #101112; overflow: hidden;">

  <div style="display: flex; align-items: center; padding: 0 24px; height: 54px; border-bottom: 1px solid #101112; background: #f9f9f7; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#101112" stroke-width="1.3">
        <circle cx="16" cy="16" r="13" stroke="#1d5c6b" stroke-dasharray="2 4"></circle>
        <path d="M6 11c7 6 13 6 20 0M5 20c8-5 14-5 22 0" opacity="0.4"></path>
        <ellipse cx="16" cy="17" rx="5" ry="6"></ellipse>
        <circle cx="13.6" cy="14" r="1.6" fill="#101112"></circle>
        <circle cx="18.4" cy="14" r="1.6" fill="#101112"></circle>
        <path d="M11 15l-4-3M21 15l4-3M11 19l-4 2M21 19l4 2"></path>
      </svg>
      <span style="font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-size: 20px; font-weight: 500; letter-spacing: 0.02em;">WEAVELING</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <span style="display: grid; place-items: center; width: 44px; height: 54px; border-left: 1px solid #dcdcd8;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4c4f" stroke-width="1.6"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"></path></svg>
    </span>
  </div>

  <div style="flex-grow: 1; padding: 0 24px; overflow: hidden;">

    <div style="display: flex; align-items: flex-end; padding: 54px 0 30px; border-bottom: 1px solid #101112;">
      <div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #6b6d70; margin-bottom: 12px;">WORKSPACE / 3 BOOKS</div>
        <h1 style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-size: 56px; line-height: 0.98; font-weight: 400; letter-spacing: -0.01em;">Your books</h1>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-items: stretch;">
        <div style="display: flex; align-items: center; padding: 0 14px; width: 288px; height: 42px; border: 1px solid #101112; border-right: 0; background: #fbfbf9; font-size: 14px; color: #a7a9ab;">A working title&#8230;</div>
        <div style="display: grid; place-items: center; padding: 0 20px; height: 42px; background: #101112; color: #f4f4f2; font-size: 13.5px;">Begin</div>
      </div>
    </div>

    <div style="display: flex; padding: 12px 0; border-bottom: 1px solid #dcdcd8; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #a7a9ab;">
      <span style="width: 48px;">NO.</span>
      <span style="flex-grow: 1;">TITLE</span>
      <span style="width: 120px; text-align: right;">PIECES</span>
      <span style="width: 200px; text-align: right;">TOUCHED</span>
      <span style="width: 48px;"></span>
    </div>

    <div style="display: flex; align-items: baseline; padding: 22px 0; border-bottom: 1px solid #dcdcd8;">
      <span style="width: 48px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a7a9ab;">01</span>
      <span style="flex-grow: 1; font-family: 'Bodoni Moda', Didot, serif; font-size: 26px;">The Salt Road</span>
      <span style="width: 120px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px;">31</span>
      <span style="width: 200px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6b6d70;">4 MIN AGO</span>
      <span style="width: 48px; text-align: right;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b6d70" stroke-width="1.8"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </span>
    </div>

    <div style="display: flex; align-items: baseline; padding: 22px 0; border-bottom: 1px solid #dcdcd8;">
      <span style="width: 48px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a7a9ab;">02</span>
      <span style="flex-grow: 1; font-family: 'Bodoni Moda', Didot, serif; font-size: 26px;">Nine Ways Home</span>
      <span style="width: 120px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px;">7</span>
      <span style="width: 200px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6b6d70;">YESTERDAY</span>
      <span style="width: 48px; text-align: right;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b6d70" stroke-width="1.8"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </span>
    </div>

    <div style="display: flex; align-items: baseline; padding: 22px 0; border-bottom: 1px solid #dcdcd8;">
      <span style="width: 48px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a7a9ab;">03</span>
      <span style="flex-grow: 1; font-family: 'Bodoni Moda', Didot, serif; font-size: 26px;">The Cartographer's Daughter</span>
      <span style="width: 120px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px;">112</span>
      <span style="width: 200px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6b6d70;">LAST WEEK</span>
      <span style="width: 48px; text-align: right;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6b6d70" stroke-width="1.8"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
