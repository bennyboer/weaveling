[workspace]
resolver = "3"
members = [
    "clients/*",
    "libraries/*",
    "services/*",
    "spikes/*",
    "features/*/contract",
    "features/*/core",
    "features/*/adapters/*",
    "features/*/tests",
    "features/*/wiring",
]
default-members = [
    "libraries/*",
    "services/*",
    "spikes/crdt",
    "spikes/sync",
    "features/*/contract",
    "features/*/core",
    "features/*/adapters/*",
    "features/*/tests",
    "features/*/wiring",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
axum-test = "21.0.0"
console_error_panic_hook = "0.1.7"
futures-util = "0.3.31"
gloo-net = { version = "0.7.0", features = ["json"] }
leptos = "0.9.0-beta"
leptos_router = "0.9.0-beta1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
time = "0.3.55"
tokio = "1.53.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.24.0"
wasm-bindgen = "0.2.127"
web-sys = "0.3.104"
yrs = "0.27.3"
