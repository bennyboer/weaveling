[workspace]
resolver = "3"
members = [
    "clients/*",
    "libraries/*",
    "services/*",
    "features/*/contract",
    "features/*/core",
    "features/*/adapters/*",
    "features/*/tests",
    "features/*/wiring",
]
default-members = [
    "libraries/*",
    "services/*",
    "features/*/contract",
    "features/*/core",
    "features/*/adapters/*",
    "features/*/tests",
    "features/*/wiring",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
axum-test = "21.0.0"
console_error_panic_hook = "0.1.7"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
futures-util = "0.3.34"
hmac = "0.13.0"
gloo-net = { version = "0.7.0", features = ["json"] }
leptos = "0.9.0-rc1"
leptos_router = "0.9.0-rc1"
indexmap = "2.14.2"
qrcodegen = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
totp-rs = "6.0.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "json", "time", "migrate", "macros"] }
getrandom = "0.4.3"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = "0.9.6"
uuid = "1.29.1"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
yrs = "0.28.1"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
