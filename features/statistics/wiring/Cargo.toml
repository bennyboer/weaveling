[package]
name = "weaveling-statistics-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, optional = true }

live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

statistics-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-statistics-catalog" }
statistics-core = { version = "0.1.0", path = "../core", package = "weaveling-statistics-core" }
statistics-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-statistics-messaging" }
statistics-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-statistics-rest" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "statistics-catalog/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "statistics-catalog/sqlite"]
