[package]
name = "weaveling-statistics-tests"
version.workspace = true
edition.workspace = true

[dev-dependencies]
axum-test = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }

statistics-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-statistics-catalog" }
statistics-contract = { version = "0.1.0", path = "../contract", package = "weaveling-statistics-contract" }
statistics-core = { version = "0.1.0", path = "../core", package = "weaveling-statistics-core" }
statistics-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-statistics-messaging" }
statistics-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-statistics-rest" }

# Foreign contracts: another feature's published events. A feature may reach across the seam
# for a `contract` crate and nothing else — never its `core`, never its adapters.
scenes-contract = { version = "0.1.0", path = "../../scenes/contract", package = "weaveling-scenes-contract" }
