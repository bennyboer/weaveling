[package]
name = "weaveling-accounts-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true, optional = true }

throttling = { version = "0.1.0", path = "../../../libraries/throttling", package = "weaveling-throttling" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
mailing = { version = "0.1.0", path = "../../../libraries/mailing", package = "weaveling-mailing" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }

accounts-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-accounts-catalog" }
accounts-core = { version = "0.1.0", path = "../core", package = "weaveling-accounts-core" }
async-trait = { workspace = true }
time = { workspace = true }
accounts-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-accounts-messaging" }
accounts-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-accounts-rest" }
accounts-secrets = { version = "0.1.0", path = "../adapters/secrets", package = "weaveling-accounts-secrets" }
accounts-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-accounts-store" }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }
trash = { version = "0.1.0", path = "../../../libraries/trash", package = "weaveling-trash" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres", "inbox/postgres", "accounts-secrets/postgres", "accounts-catalog/postgres", "throttling/postgres", "trash/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "inbox/sqlite", "accounts-secrets/sqlite", "accounts-catalog/sqlite", "throttling/sqlite", "trash/sqlite"]
