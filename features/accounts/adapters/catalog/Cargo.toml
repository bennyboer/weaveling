[package]
name = "weaveling-accounts-catalog"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, optional = true }
time = { workspace = true, features = ["serde-well-known"] }

clock = { version = "0.1.0", path = "../../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }

accounts-core = { version = "0.1.0", path = "../../core", package = "weaveling-accounts-core" }

[features]
postgres = ["dep:sqlx"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
test-harness = { version = "0.1.0", path = "../../../../libraries/test-harness", package = "weaveling-test-harness" }
