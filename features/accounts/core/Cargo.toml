[package]
name = "weaveling-accounts-core"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
totp-rs = { workspace = true }
webauthn-rs = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }

acting = { version = "0.1.0", path = "../../../libraries/acting", package = "weaveling-acting" }
ending = { version = "0.1.0", path = "../../../libraries/ending", package = "weaveling-ending" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
ids = { version = "0.1.0", path = "../../../libraries/ids", package = "weaveling-ids" }
mailing = { version = "0.1.0", path = "../../../libraries/mailing", package = "weaveling-mailing" }
email = { version = "0.1.0", path = "../../../libraries/email", package = "weaveling-email" }
throttling = { version = "0.1.0", path = "../../../libraries/throttling", package = "weaveling-throttling" }
words = { version = "0.1.0", path = "../../../libraries/words", package = "weaveling-words" }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
