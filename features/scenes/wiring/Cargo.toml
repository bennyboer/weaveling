[package]
name = "weaveling-scenes-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
time = { workspace = true }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
sqlx = { workspace = true, optional = true }

wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }


clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }

scenes-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-scenes-catalog" }
scenes-core = { version = "0.1.0", path = "../core", package = "weaveling-scenes-core" }
scenes-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-scenes-messaging" }
scenes-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-scenes-rest" }
scenes-sync = { version = "0.1.0", path = "../adapters/sync", package = "weaveling-scenes-sync" }
scenes-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-scenes-store" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "outbox/postgres", "scenes-store/postgres", "scenes-catalog/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "outbox/sqlite", "scenes-store/sqlite", "scenes-catalog/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
