[package]
name = "weaveling-ideas-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
time = { workspace = true }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
sqlx = { workspace = true, optional = true }

wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }


clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }

ideas-core = { version = "0.1.0", path = "../core", package = "weaveling-ideas-core" }
ideas-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-ideas-messaging" }
ideas-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-ideas-rest" }
ideas-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-ideas-catalog" }
ideas-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-ideas-store" }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres", "inbox/postgres", "ideas-catalog/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "inbox/sqlite", "ideas-catalog/sqlite"]
