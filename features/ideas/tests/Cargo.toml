[package]
name = "weaveling-ideas-tests"
version.workspace = true
edition.workspace = true

[dev-dependencies]
async-trait = { workspace = true }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
axum = { workspace = true }
axum-test = { workspace = true, features = ["ws"] }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

projects-contract = { version = "0.1.0", path = "../../projects/contract", package = "weaveling-projects-contract" }
ideas-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-ideas-catalog" }
ideas-contract = { version = "0.1.0", path = "../contract", package = "weaveling-ideas-contract" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live", features = ["testing"] }
live-contract = { version = "0.1.0", path = "../../../libraries/live-contract", package = "weaveling-live-contract" }
ideas-core = { version = "0.1.0", path = "../core", package = "weaveling-ideas-core" }
ideas-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-ideas-messaging" }
ideas-wiring = { version = "0.1.0", path = "../wiring", package = "weaveling-ideas-wiring" }
