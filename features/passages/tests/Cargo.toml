[package]
name = "weaveling-passages-tests"
version.workspace = true
edition.workspace = true

[dev-dependencies]
axum = { workspace = true }
axum-test = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde_json = { workspace = true }
yrs = { workspace = true }

clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
passages-contract = { version = "0.1.0", path = "../contract", package = "weaveling-passages-contract" }
passages-core = { version = "0.1.0", path = "../core", package = "weaveling-passages-core" }
passages-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-passages-messaging" }
passages-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-passages-rest" }
passages-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-passages-store" }
passages-sync = { version = "0.1.0", path = "../adapters/sync", package = "weaveling-passages-sync" }

# Foreign contracts: another feature's published events. A feature may reach across the seam
# for a `contract` crate and nothing else — never its `core`, never its adapters.
ideas-contract = { version = "0.1.0", path = "../../ideas/contract", package = "weaveling-ideas-contract" }
