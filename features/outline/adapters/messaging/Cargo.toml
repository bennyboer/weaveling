[package]
name = "weaveling-outline-messaging"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

clock = { version = "0.1.0", path = "../../../../libraries/clock", package = "weaveling-clock" }
eventpublishing = { version = "0.1.0", path = "../../../../libraries/eventpublishing", package = "weaveling-eventpublishing" }
eventsourcing = { version = "0.1.0", path = "../../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
ids = { version = "0.1.0", path = "../../../../libraries/ids", package = "weaveling-ids" }
messaging = { version = "0.1.0", path = "../../../../libraries/messaging", package = "weaveling-messaging" }

outline-contract = { version = "0.1.0", path = "../../contract", package = "weaveling-outline-contract" }
outline-core = { version = "0.1.0", path = "../../core", package = "weaveling-outline-core" }

# Foreign contracts: another feature's published events. A feature may reach across the seam
# for a `contract` crate and nothing else — never its `core`, never its adapters.
pieces-contract = { version = "0.1.0", path = "../../../pieces/contract", package = "weaveling-pieces-contract" }
projects-contract = { version = "0.1.0", path = "../../../projects/contract", package = "weaveling-projects-contract" }

[dev-dependencies]
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
