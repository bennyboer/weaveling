[package]
name = "weaveling-pieces-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, optional = true }

wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }


clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }

pieces-core = { version = "0.1.0", path = "../core", package = "weaveling-pieces-core" }
pieces-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-pieces-messaging" }
pieces-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-pieces-rest" }
pieces-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-pieces-catalog" }
pieces-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-pieces-store" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "eventsourcing/postgres", "pieces-catalog/postgres"]
