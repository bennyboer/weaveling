[package]
name = "weaveling-invitations-catalog"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
time = { workspace = true }

clock = { version = "0.1.0", path = "../../../../libraries/clock", package = "weaveling-clock" }
email = { version = "0.1.0", path = "../../../../libraries/email", package = "weaveling-email" }
eventsourcing = { version = "0.1.0", path = "../../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }

invitations-core = { version = "0.1.0", path = "../../core", package = "weaveling-invitations-core" }

[features]
postgres = ["dep:sqlx"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
test-harness = { version = "0.1.0", path = "../../../../libraries/test-harness", package = "weaveling-test-harness" }
