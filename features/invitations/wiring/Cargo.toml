[package]
name = "weaveling-invitations-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
time = { workspace = true }
sqlx = { workspace = true, optional = true }

chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
mailing = { version = "0.1.0", path = "../../../libraries/mailing", package = "weaveling-mailing" }
throttling = { version = "0.1.0", path = "../../../libraries/throttling", package = "weaveling-throttling" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

invitations-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-invitations-catalog" }
invitations-core = { version = "0.1.0", path = "../core", package = "weaveling-invitations-core" }
invitations-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-invitations-rest" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
invitations-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-invitations-messaging" }
invitations-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-invitations-store" }

[features]
postgres = ["dep:sqlx", "invitations-catalog/postgres", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres", "throttling/postgres"]
sqlite = ["dep:sqlx", "invitations-catalog/sqlite", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "throttling/sqlite"]

[dev-dependencies]
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
acting = { version = "0.1.0", path = "../../../libraries/acting", package = "weaveling-acting" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
test-harness = { version = "0.1.0", path = "../../../libraries/test-harness", package = "weaveling-test-harness" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
email = { version = "0.1.0", path = "../../../libraries/email", package = "weaveling-email" }
