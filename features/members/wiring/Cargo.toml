[package]
name = "weaveling-members-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true }
sqlx = { workspace = true, optional = true }

authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

members-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-members-catalog" }
members-core = { version = "0.1.0", path = "../core", package = "weaveling-members-core" }
members-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-members-messaging" }
members-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-members-store" }

[features]
postgres = ["dep:sqlx", "members-catalog/postgres", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres"]
sqlite = ["dep:sqlx", "members-catalog/sqlite", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite"]

[dev-dependencies]
test-harness = { version = "0.1.0", path = "../../../libraries/test-harness", package = "weaveling-test-harness" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
