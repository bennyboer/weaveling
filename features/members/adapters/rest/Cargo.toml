[package]
name = "weaveling-members-rest"
version.workspace = true
edition.workspace = true

[dependencies]
authorizing = { version = "0.1.0", path = "../../../../libraries/authorizing", package = "weaveling-authorizing" }
async-trait = { workspace = true }
serde = { workspace = true }
axum = { workspace = true, features = ["ws"] }
serde_json = { workspace = true }

eventsourcing = { version = "0.1.0", path = "../../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
live-contract = { version = "0.1.0", path = "../../../../libraries/live-contract", package = "weaveling-live-contract" }
live = { version = "0.1.0", path = "../../../../libraries/live", package = "weaveling-live" }
serving = { version = "0.1.0", path = "../../../../libraries/serving", package = "weaveling-serving" }

members-contract = { version = "0.1.0", path = "../../contract", package = "weaveling-members-contract" }
members-core = { version = "0.1.0", path = "../../core", package = "weaveling-members-core" }

[dev-dependencies]
live = { version = "0.1.0", path = "../../../../libraries/live", package = "weaveling-live", features = ["testing"] }
axum-test = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
time = { workspace = true }
clock = { version = "0.1.0", path = "../../../../libraries/clock", package = "weaveling-clock" }
members-catalog = { version = "0.1.0", path = "../catalog", package = "weaveling-members-catalog" }
