[package]
name = "weaveling-appearances-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, optional = true }

outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

appearances-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-appearances-catalog" }
appearances-core = { version = "0.1.0", path = "../core", package = "weaveling-appearances-core" }
appearances-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-appearances-messaging" }
appearances-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-appearances-rest" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "appearances-catalog/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "appearances-catalog/sqlite"]
