[package]
name = "weaveling-appearances-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
sqlx = { workspace = true, optional = true }
time = { workspace = true }
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }

live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

appearances-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-appearances-catalog" }
appearances-core = { version = "0.1.0", path = "../core", package = "weaveling-appearances-core" }
appearances-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-appearances-messaging" }
appearances-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-appearances-rest" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "appearances-catalog/postgres", "transacting/postgres", "inbox/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "appearances-catalog/sqlite", "transacting/sqlite", "inbox/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
