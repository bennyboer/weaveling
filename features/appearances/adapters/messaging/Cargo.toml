[package]
name = "weaveling-appearances-messaging"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
access = { version = "0.1.0", path = "../../../../libraries/access", package = "weaveling-access" }

projects-contract = { version = "0.1.0", path = "../../../projects/contract", package = "weaveling-projects-contract" }
eventpublishing = { version = "0.1.0", path = "../../../../libraries/eventpublishing", package = "weaveling-eventpublishing" }
eventsourcing = { version = "0.1.0", path = "../../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
inbox = { version = "0.1.0", path = "../../../../libraries/inbox", package = "weaveling-inbox" }
messaging = { version = "0.1.0", path = "../../../../libraries/messaging", package = "weaveling-messaging" }
transacting = { version = "0.1.0", path = "../../../../libraries/transacting", package = "weaveling-transacting" }

appearances-core = { version = "0.1.0", path = "../../core", package = "weaveling-appearances-core" }

# Foreign contracts: another feature's published events. A feature may reach across the seam
# for a `contract` crate and nothing else — never its `core`, never its adapters.
ideas-contract = { version = "0.1.0", path = "../../../ideas/contract", package = "weaveling-ideas-contract" }
members-contract = { version = "0.1.0", path = "../../../members/contract", package = "weaveling-members-contract" }
outline-contract = { version = "0.1.0", path = "../../../outline/contract", package = "weaveling-outline-contract" }
scenes-contract = { version = "0.1.0", path = "../../../scenes/contract", package = "weaveling-scenes-contract" }
