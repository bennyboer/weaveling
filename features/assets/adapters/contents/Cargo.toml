[package]
name = "weaveling-assets-contents"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs"] }

assets-core = { version = "0.1.0", path = "../../core", package = "weaveling-assets-core" }

[features]
postgres = ["dep:sqlx"]

[dev-dependencies]
ids = { version = "0.1.0", path = "../../../../libraries/ids", package = "weaveling-ids" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs"] }
test-harness = { version = "0.1.0", path = "../../../../libraries/test-harness", package = "weaveling-test-harness" }
