[package]
name = "weaveling-assets-tests"
version.workspace = true
edition.workspace = true

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
axum-test = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }

access = { version = "0.1.0", path = "../../../libraries/access", package = "weaveling-access" }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing", features = ["testing"] }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
eventpublishing = { version = "0.1.0", path = "../../../libraries/eventpublishing", package = "weaveling-eventpublishing", features = ["testing"] }
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
serving = { version = "0.1.0", path = "../../../libraries/serving", package = "weaveling-serving" }

assets-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-assets-catalog" }
assets-contract = { version = "0.1.0", path = "../contract", package = "weaveling-assets-contract" }
assets-contents = { version = "0.1.0", path = "../adapters/contents", package = "weaveling-assets-contents" }
assets-core = { version = "0.1.0", path = "../core", package = "weaveling-assets-core" }
assets-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-assets-rest" }
assets-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-assets-messaging" }

accounts-contract = { version = "0.1.0", path = "../../accounts/contract", package = "weaveling-accounts-contract" }
members-contract = { version = "0.1.0", path = "../../members/contract", package = "weaveling-members-contract" }
projects-contract = { version = "0.1.0", path = "../../projects/contract", package = "weaveling-projects-contract" }
