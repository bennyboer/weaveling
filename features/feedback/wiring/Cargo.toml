[package]
name = "weaveling-feedback-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
sqlx = { workspace = true, optional = true }

access = { version = "0.1.0", path = "../../../libraries/access", package = "weaveling-access" }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

feedback-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-feedback-catalog" }
feedback-core = { version = "0.1.0", path = "../core", package = "weaveling-feedback-core" }
feedback-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-feedback-store" }
feedback-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-feedback-rest" }
feedback-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-feedback-messaging" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres", "feedback-catalog/postgres", "transacting/postgres", "inbox/postgres", "access/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "feedback-catalog/sqlite", "transacting/sqlite", "inbox/sqlite", "access/sqlite"]
