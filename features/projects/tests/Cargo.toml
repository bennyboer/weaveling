[package]
name = "weaveling-projects-tests"
version.workspace = true
edition.workspace = true

[dev-dependencies]
inbox = { version = "0.1.0", path = "../../../libraries/inbox", package = "weaveling-inbox" }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
trash = { version = "0.1.0", path = "../../../libraries/trash", package = "weaveling-trash" }
transacting = { version = "0.1.0", path = "../../../libraries/transacting", package = "weaveling-transacting" }
async-trait = { workspace = true }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
axum = { workspace = true }
axum-test = { workspace = true, features = ["ws"] }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }

clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing", features = ["testing"] }
eventpublishing = { version = "0.1.0", path = "../../../libraries/eventpublishing", package = "weaveling-eventpublishing", features = ["testing"] }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }

members-contract = { version = "0.1.0", path = "../../members/contract", package = "weaveling-members-contract" }
projects-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-projects-catalog" }
projects-contract = { version = "0.1.0", path = "../contract", package = "weaveling-projects-contract" }
projects-core = { version = "0.1.0", path = "../core", package = "weaveling-projects-core" }
projects-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-projects-messaging" }
projects-wiring = { version = "0.1.0", path = "../wiring", package = "weaveling-projects-wiring" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live", features = ["testing"] }
live-contract = { version = "0.1.0", path = "../../../libraries/live-contract", package = "weaveling-live-contract" }
