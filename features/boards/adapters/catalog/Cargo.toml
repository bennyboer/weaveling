[package]
name = "weaveling-boards-catalog"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
sqlx = { workspace = true, optional = true }
time = { workspace = true }
clock = { version = "0.1.0", path = "../../../../libraries/clock", package = "weaveling-clock" }


transacting = { version = "0.1.0", path = "../../../../libraries/transacting", package = "weaveling-transacting" }

boards-core = { version = "0.1.0", path = "../../core", package = "weaveling-boards-core" }

[features]
postgres = ["dep:sqlx", "transacting/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "transacting/sqlite"]

[dev-dependencies]
registry = { version = "0.1.0", path = "../../../../libraries/registry", package = "weaveling-registry", features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
test-harness = { version = "0.1.0", path = "../../../../libraries/test-harness", package = "weaveling-test-harness" }
