[package]
name = "weaveling-boards-wiring"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
time = { workspace = true }
chores = { version = "0.1.0", path = "../../../libraries/chores", package = "weaveling-chores" }
sqlx = { workspace = true, optional = true }

wiring = { version = "0.1.0", path = "../../../libraries/wiring", package = "weaveling-wiring" }


clock = { version = "0.1.0", path = "../../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
live = { version = "0.1.0", path = "../../../libraries/live", package = "weaveling-live" }
outbox = { version = "0.1.0", path = "../../../libraries/outbox", package = "weaveling-outbox" }
registry = { version = "0.1.0", path = "../../../libraries/registry", package = "weaveling-registry" }

boards-contract = { version = "0.1.0", path = "../contract", package = "weaveling-boards-contract" }
boards-core = { version = "0.1.0", path = "../core", package = "weaveling-boards-core" }
boards-rest = { version = "0.1.0", path = "../adapters/rest", package = "weaveling-boards-rest" }
boards-messaging = { version = "0.1.0", path = "../adapters/messaging", package = "weaveling-boards-messaging" }
boards-catalog = { version = "0.1.0", path = "../adapters/catalog", package = "weaveling-boards-catalog" }
boards-store = { version = "0.1.0", path = "../adapters/store", package = "weaveling-boards-store" }

[features]
postgres = ["dep:sqlx", "wiring/postgres", "eventsourcing/postgres", "outbox/postgres", "registry/postgres", "boards-catalog/postgres"]
sqlite = ["dep:sqlx", "wiring/sqlite", "eventsourcing/sqlite", "outbox/sqlite", "registry/sqlite", "boards-catalog/sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
authorizing = { version = "0.1.0", path = "../../../libraries/authorizing", package = "weaveling-authorizing" }
messaging = { version = "0.1.0", path = "../../../libraries/messaging", package = "weaveling-messaging" }
