name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://weaveling:weaveling@127.0.0.1:5432/weaveling

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: weaveling
          POSTGRES_PASSWORD: weaveling
          POSTGRES_DB: weaveling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaveling -d weaveling"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: bundle the editor
        working-directory: clients/web
        run: |
          npm ci
          npm run build:js

      - name: formatting
        run: cargo fmt --all --check

      - name: lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: lint the client
        run: cargo clippy -p weaveling-client-web --target wasm32-unknown-unknown -- -D warnings

      - uses: taiki-e/install-action@nextest

      - name: test
        run: cargo nextest run --workspace --all-features

  browser:
    name: browser (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: served, run: test, traces: e2e }
          - { name: local, run: "test:local", traces: e2e-local }
          - { name: accounts, run: "test:accounts", traces: e2e-accounts }

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.11

      - name: install the browser
        working-directory: clients/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: bundle the editor
        working-directory: clients/web
        run: npm run build:js

      - name: test in a browser
        working-directory: clients/web
        run: npm run ${{ matrix.suite.run }}

      - name: keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.suite.name }}
          path: target/web/${{ matrix.suite.traces }}
          retention-days: 14
