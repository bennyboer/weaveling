[package]
name = "weaveling-service-api"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { workspace = true, features = ["trace", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

#################
### LIBRARIES ###
#################

clock = { version = "0.1.0", path = "../../libraries/clock", package = "weaveling-clock" }
eventsourcing = { version = "0.1.0", path = "../../libraries/eventsourcing", package = "weaveling-eventsourcing" }
wiring = { version = "0.1.0", path = "../../libraries/wiring", package = "weaveling-wiring" }
messaging = { version = "0.1.0", path = "../../libraries/messaging", package = "weaveling-messaging" }
serving = { version = "0.1.0", path = "../../libraries/serving", package = "weaveling-serving" }
chores = { version = "0.1.0", path = "../../libraries/chores", package = "weaveling-chores" }
mailing = { version = "0.1.0", path = "../../libraries/mailing", package = "weaveling-mailing" }
live = { version = "0.1.0", path = "../../libraries/live", package = "weaveling-live" }
serde_json = { workspace = true }
messaging-contract = { version = "0.1.0", path = "../../libraries/messaging-contract", package = "weaveling-messaging-contract" }
outbox = { version = "0.1.0", path = "../../libraries/outbox", package = "weaveling-outbox" }

################
### FEATURES ###
################

accounts-contract = { version = "0.1.0", path = "../../features/accounts/contract", package = "weaveling-accounts-contract" }
accounts-core = { version = "0.1.0", path = "../../features/accounts/core", package = "weaveling-accounts-core" }
accounts-rest = { version = "0.1.0", path = "../../features/accounts/adapters/rest", package = "weaveling-accounts-rest" }
accounts-wiring = { version = "0.1.0", path = "../../features/accounts/wiring", package = "weaveling-accounts-wiring" }
invitations-wiring = { version = "0.1.0", path = "../../features/invitations/wiring", package = "weaveling-invitations-wiring" }
appearances-wiring = { version = "0.1.0", path = "../../features/appearances/wiring", package = "weaveling-appearances-wiring" }
boards-wiring = { version = "0.1.0", path = "../../features/boards/wiring", package = "weaveling-boards-wiring" }
outline-wiring = { version = "0.1.0", path = "../../features/outline/wiring", package = "weaveling-outline-wiring" }
scenes-wiring = { version = "0.1.0", path = "../../features/scenes/wiring", package = "weaveling-scenes-wiring" }
ideas-wiring = { version = "0.1.0", path = "../../features/ideas/wiring", package = "weaveling-ideas-wiring" }
projects-wiring = { version = "0.1.0", path = "../../features/projects/wiring", package = "weaveling-projects-wiring" }
statistics-wiring = { version = "0.1.0", path = "../../features/statistics/wiring", package = "weaveling-statistics-wiring" }


[features]
default = ["postgres", "sqlite"]
postgres = [
    "dep:sqlx",
    "outbox/postgres",
    "wiring/postgres",
    "accounts-wiring/postgres",
    "invitations-wiring/postgres",
    "appearances-wiring/postgres",
    "boards-wiring/postgres",
    "outline-wiring/postgres",
    "ideas-wiring/postgres",
    "scenes-wiring/postgres",
    "projects-wiring/postgres",
    "statistics-wiring/postgres",
]
sqlite = [
    "dep:sqlx",
    "messaging/sqlite",
    "outbox/sqlite",
    "wiring/sqlite",
    "accounts-wiring/sqlite",
    "invitations-wiring/sqlite",
    "appearances-wiring/sqlite",
    "boards-wiring/sqlite",
    "outline-wiring/sqlite",
    "ideas-wiring/sqlite",
    "scenes-wiring/sqlite",
    "projects-wiring/sqlite",
    "statistics-wiring/sqlite",
]

[dev-dependencies]
tower = { workspace = true }
axum-test = { workspace = true, features = ["ws"] }
time = { workspace = true, features = ["macros"] }
sqlx = { workspace = true }
test-harness = { version = "0.1.0", path = "../../libraries/test-harness", package = "weaveling-test-harness" }